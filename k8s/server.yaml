apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: opc-monitor
spec:
  selector:
    app: server
  ports:
    - port: 4840
      targetPort: 4840
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: opc-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: opc-monitor:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "server.py"]
          ports:
            - containerPort: 4840
          env:
            - name: TZ
              value: "Europe/Moscow"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"