apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: opc-monitor
  labels:
    app: web
spec:
  selector:
    app: web
  ports:
    - name: web
      port: 5000
      targetPort: 5000
      nodePort: 30500
    - name: metrics
      port: 8001
      targetPort: 8001
      nodePort: 30801
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: opc-monitor
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: web
          image: opc-monitor:latest
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "-k", "gthread", "-w", "1", "web_app:app", "-b", "0.0.0.0:5000"]
          ports:
            - containerPort: 5000
              name: web
            - containerPort: 8001
              name: metrics
          env:
            - name: TZ
              value: "Europe/Moscow"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: ADMIN_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: JWT_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Временно отключены healthcheck для диагностики
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 5000
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 5000
          #   initialDelaySeconds: 10
          #   periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: opc-config