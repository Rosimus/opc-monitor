apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opc-monitor-default-deny-ingress
  namespace: opc-monitor
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Разрешаем трафик внутри namespace (между подами)
    - from:
        - podSelector: {}
    # Разрешаем внешний ingress на web:5000 (NodePort)
    - ports:
        - port: 5000
          protocol: TCP
