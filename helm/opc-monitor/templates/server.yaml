{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
  labels:
    app: server
spec:
  selector:
    app: server
  ports:
    - port: 4840
      targetPort: 4840
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Release.Namespace }}
  labels:
    app: server
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      serviceAccountName: opc-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "opc-monitor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "server.py"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4840
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            # OPC UA security
            - name: OPC_ADVERTISE_URL
              value: {{ .Values.opcConfig.advertiseUrl | default "opc.tcp://server:4840" | quote }}
            - name: OPC_SECURITY_MODE
              value: {{ .Values.opcSecurity.mode | default "None" | quote }}
            - name: OPC_CERT_DIR
              value: "/certs"
            - name: OPC_USER
              value: {{ .Values.opcSecurity.user | default "operator" | quote }}
            - name: OPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: OPC_PASSWORD
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if ne (.Values.opcSecurity.mode | default "None") "None" }}
            - name: certs
              mountPath: /certs
              readOnly: true
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: 4840
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 4840
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if ne (.Values.opcSecurity.mode | default "None") "None" }}
        - name: certs
          secret:
            secretName: opc-certs
            defaultMode: 0440
        {{- end }}
{{- end }}