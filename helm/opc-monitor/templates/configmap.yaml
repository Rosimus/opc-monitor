apiVersion: v1
kind: ConfigMap
metadata:
  name: opc-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opc-monitor.labels" . | nindent 4 }}
data:
  config.yaml: |
    opc:
      url: {{ .Values.opcConfig.url | quote }}
      node_plc: {{ .Values.opcConfig.nodePlc | quote }}
      params:
        {{- toYaml .Values.opcConfig.params | nindent 8 }}
    alerts:
      cooldown_seconds: 300
    retention:
      enabled: true
      days: 30
    email:
      enabled: false
      sender: ""
      recipient: ""
      smtp_server: "smtp.gmail.com"
      smtp_port: 587
    telegram:
      enabled: false
      bot_token: ""
      chat_id: ""
    logging:
      level: "INFO"
      file: "/app/data/client.log"
      max_bytes: 1048576
      backup_count: 3
