{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    app: web
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - name: web
      port: {{ .Values.web.service.port }}
      targetPort: 5000
    - name: metrics
      port: {{ .Values.web.service.metricsPort }}
      targetPort: 8001
  type: {{ .Values.web.service.type }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    app: web
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  {{- if not .Values.web.hpa.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: opc-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting-for-postgres; sleep 2; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "10Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "50Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: web
          image: {{ include "opc-monitor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["gunicorn", "-k", "gthread", "-w", "4", "web_app:app", "-b", "0.0.0.0:5000", "--no-control"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
              name: web
            - containerPort: 8001
              name: metrics
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: ADMIN_PASSWORD
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: JWT_SECRET_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_DB
            # Sentinel-режим (K8s). db.py читает REDIS_SENTINEL_HOSTS
            # и использует redis.sentinel.Sentinel вместо single-node.
            # Spotahome v1.2.4 создаёт sentinel-service как "rfs-<name>"
            # и не создаёт master-service, пока не задан .spec.redis.service.
            # В Sentinel-режиме клиент сам получает адрес мастера — master-service
            # не нужен.
            - name: REDIS_SENTINEL_HOSTS
              value: "rfs-{{ .Values.redis.failoverName }}"
            - name: REDIS_SENTINEL_PORT
              value: "26379"
            - name: REDIS_MASTER_NAME
              value: {{ .Values.redis.failoverName | quote }}
            # Flask-Limiter через limits понимает redis+sentinel://
            - name: REDIS_URL
              value: "redis+sentinel://rfs-{{ .Values.redis.failoverName }}:26379/{{ .Values.redis.failoverName }}/0"
            - name: RATELIMIT_DEFAULT
              value: {{ .Values.web.ratelimitDefault | default "1000 per hour, 200 per minute" | quote }} 
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
            - name: OTEL_SERVICE_NAME
              value: "opc-monitor-web"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: opc-config
{{- end }}