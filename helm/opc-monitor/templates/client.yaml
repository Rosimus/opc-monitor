{{- if .Values.client.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: {{ .Release.Namespace }}
  labels:
    app: client
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  selector:
    app: client
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: {{ .Release.Namespace }}
  labels:
    app: client
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.client.replicaCount }}
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: client
          image: {{ include "opc-monitor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "client.py"]
          ports:
            - name: metrics
              containerPort: 8001
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: EMAIL_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_DB
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: opc-config
{{- end }}