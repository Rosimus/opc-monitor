{{- if .Values.client.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: {{ .Release.Namespace }}
  labels:
    app: client
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  selector:
    app: client
  ports:
    - name: metrics
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: {{ .Release.Namespace }}
  labels:
    app: client
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.client.replicaCount }}
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
    spec:
      serviceAccountName: opc-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting-for-postgres; sleep 2; done"]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
              ephemeral-storage: "10Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "50Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: client
          image: {{ include "opc-monitor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "client.py"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 8001
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: EMAIL_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: POSTGRES_DB
            # OPC UA security
            - name: OPC_URL
              value: {{ .Values.opcConfig.url | default "opc.tcp://server:4840" | quote }}
            - name: OPC_SECURITY_MODE
              value: {{ .Values.opcSecurity.mode | default "None" | quote }}
            - name: OPC_CERT_DIR
              value: "/certs"
            - name: OPC_USER
              value: {{ .Values.opcSecurity.user | default "operator" | quote }}
            - name: OPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opc-secrets
                  key: OPC_PASSWORD
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger:4317"
            - name: OTEL_SERVICE_NAME
              value: "opc-monitor-client"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
            {{- if ne (.Values.opcSecurity.mode | default "None") "None" }}
            - name: certs
              mountPath: /certs
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: opc-config
        {{- if ne (.Values.opcSecurity.mode | default "None") "None" }}
        - name: certs
          secret:
            secretName: opc-certs
            defaultMode: 0400
        {{- end }}
{{- end }}