{{- if .Values.vpa.enabled }}
{{- range .Values.vpa.targets }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .name }}-vpa
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "opc-monitor.labels" $ | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: {{ .kind | default "Deployment" }}
    name: {{ .name }}
  updatePolicy:
    updateMode: {{ .mode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        controlledResources:
          - cpu
          - memory
        {{- if .minAllowed }}
        minAllowed:
          {{- toYaml .minAllowed | nindent 10 }}
        {{- end }}
        {{- if .maxAllowed }}
        maxAllowed:
          {{- toYaml .maxAllowed | nindent 10 }}
        {{- end }}
{{- end }}
{{- end }}