{{- if .Values.prometheus.enabled }}
# ============================================
# Service
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
# ============================================
# Deployment
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    app: prometheus
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate          # RWO PVC — RollingUpdate приводит к TSDB lock
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: opc-app
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time={{ .Values.prometheus.retention }}'
            - '--web.enable-remote-write-receiver'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: storage
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
# ============================================
# ConfigMap: prometheus.yml + alerts.yml
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opc-monitor.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - 'alertmanager:9093'
    scrape_configs:
      - job_name: 'opc-monitor'
        static_configs:
          - targets: ['web:5000']
        metrics_path: /metrics
      - job_name: 'opc-client'
        static_configs:
          - targets: ['client:8001']
      - job_name: 'alertmanager'
        static_configs:
          - targets: ['alertmanager:9093']

  alerts.yml: |
    groups:
      - name: opc-monitor-alerts
        interval: 30s
        rules:
          - alert: ServiceDown
            expr: up == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Сервис {{ `{{ $labels.job }}` }} недоступен"
              description: "Инстанс {{ `{{ $labels.instance }}` }} не отвечает более 1 минуты."
          - alert: HighAlarmRate
            expr: rate(opc_alerts_total[5m]) > 0.5
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Высокая частота аварий"
              description: "Частота алертов {{ `{{ $value | humanize }}` }} в секунду."
          - alert: NoMeasurements
            expr: rate(opc_values[2m]) == 0
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Нет новых измерений"
              description: "OPC UA клиент не отправляет измерения более 3 минут."
          - alert: HighAPILatency
            expr: histogram_quantile(0.95, sum(rate(api_latency_seconds_bucket[5m])) by (le)) > 1
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Высокая латентность API (p95)"
              description: "p95 латентности API > 1 секунды в течение 3 минут."
{{- end }}