apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opc-monitor-default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opc-monitor.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 5000
          protocol: TCP
