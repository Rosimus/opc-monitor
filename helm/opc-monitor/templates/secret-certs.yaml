{{- /*
Secret с OPC UA-сертификатами.
Создаётся только если opcSecurity.mode != "None".

Значения (.Values.certs.*) — base64-encoded PEM.
Заполняются через отдельный файл certs-secrets.yaml (не в git).

Генерация сертификатов и base64:
    python certs/generate.py
    # Linux/macOS:
    base64 -w0 certs/ca_cert.pem
    # Windows PowerShell:
    [Convert]::ToBase64String([IO.File]::ReadAllBytes("certs\ca_cert.pem"))

Установка:
    helm upgrade --install opc-monitor ./helm/opc-monitor \
        -f helm/opc-monitor/values-prod.yaml \
        -f helm/opc-monitor/values-secrets.yaml \
        -f helm/opc-monitor/certs-secrets.yaml
*/}}
{{- if ne (.Values.opcSecurity.mode | default "None") "None" }}
apiVersion: v1
kind: Secret
metadata:
  name: opc-certs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opc-monitor.labels" . | nindent 4 }}
type: Opaque
data:
  ca_cert.pem:     {{ required "certs.caCert is required when opcSecurity.mode != None" .Values.certs.caCert | quote }}
  server_cert.pem: {{ required "certs.serverCert is required when opcSecurity.mode != None" .Values.certs.serverCert | quote }}
  server_key.pem:  {{ required "certs.serverKey is required when opcSecurity.mode != None" .Values.certs.serverKey | quote }}
  client_cert.pem: {{ required "certs.clientCert is required when opcSecurity.mode != None" .Values.certs.clientCert | quote }}
  client_key.pem:  {{ required "certs.clientKey is required when opcSecurity.mode != None" .Values.certs.clientKey | quote }}
{{- end }}