global:
  environment: production

web:
  replicaCount: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70
  # For load testing (k6). Default in values.yaml: "1000 per hour, 200 per minute".
  ratelimitDefault: "100000 per minute"

vpa:
  enabled: true

ingress:
  enabled: false