global:
  environment: production
  timezone: "Europe/Moscow"

image:
  repository: ghcr.io/rosimus/opc-monitor
  tag: "latest"
  pullPolicy: IfNotPresent

web:
  enabled: true
  replicaCount: 2
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 5000
    metricsPort: 8001
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPU: 70

client:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"

server:
  enabled: true
  replicaCount: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

postgres:
  enabled: true
  image: postgres:15
  storage: 10Gi
  storageClassName: standard
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

redis:
  enabled: true
  image: redis:7-alpine

prometheus:
  enabled: true
  retention: 30d

alertmanager:
  enabled: true

grafana:
  enabled: true

ingress:
  enabled: false
  className: nginx
  host: opc-monitor.local
  tls:
    enabled: false
    secretName: opc-monitor-tls

secrets:
  postgresUser: opc_user
  postgresPassword: change_me_secure_password
  postgresDb: opc_monitor
  adminUser: admin
  adminPassword: change_me_secure_admin_password
  jwtSecretKey: change_me_jwt_secret
  emailPassword: ""
  grafanaPassword: admin
  telegramBotToken: "placeholder"
  telegramChatId: "0"

opcConfig:
  url: "opc.tcp://server:4840"
  nodePlc: "2:PLC"
  params:
    - id: temperature
      name: "Температура"
      node: "2:Temperature"
      unit: "°C"
      warning_low: 20.0
      alarm_low: 16.0
      warning_high: 29.0
      alarm_high: 33.0
    - id: pressure
      name: "Давление"
      node: "2:Pressure"
      unit: "кПа"
      warning_low: 90.0
      alarm_low: 85.0
      warning_high: 112.0
      alarm_high: 118.0
    - id: humidity
      name: "Влажность"
      node: "2:Humidity"
      unit: "%"
      warning_low: 35.0
      alarm_low: 32.0
      warning_high: 70.0
      alarm_high: 78.0
    - id: vibration
      name: "Вибрация"
      node: "2:Vibration"
      unit: "мм/с"
      warning_low: 3.0
      alarm_low: 4.0
    - id: current
      name: "Ток"
      node: "2:Current"
      unit: "A"
      warning_low: 5.0
      alarm_low: 7.0
    - id: speed
      name: "Скорость"
      node: "2:Speed"
      unit: "об/мин"
      warning_low: 1200.0
      alarm_low: 1300.0
    - id: level
      name: "Уровень жидкости"
      node: "2:Level"
      unit: "%"
      warning_low: 20.0
      alarm_low: 15.0
      warning_high: 80.0
      alarm_high: 87.0
    - id: frequency
      name: "Частота"
      node: "2:Frequency"
      unit: "Гц"
      warning_low: 47.0
      alarm_low: 46.0
      warning_high: 53.0
      alarm_high: 54.0