name: CD - Deploy to Local Minikube

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rosimus/opc-monitor
  NAMESPACE: opc-monitor
  RELEASE_NAME: opc-monitor

jobs:
  deploy:
    name: Deploy to Local Minikube
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check environment
        shell: powershell
        run: |
          Write-Host "=== Docker ==="
          docker --version
          Write-Host "=== kubectl ==="
          kubectl version --client
          Write-Host "=== Minikube ==="
          minikube status
          Write-Host "=== Helm ==="
          helm version

      - name: Start Minikube if needed
        shell: powershell
        run: |
          $status = minikube status --format='{{.Host}}' 2>$null
          if ($status -ne 'Running') {
            Write-Host "Starting Minikube..."
            minikube start
          } else {
            Write-Host "Minikube already running"
          }
          kubectl config use-context minikube

      - name: Logout from GHCR
        shell: powershell
        run: |
          docker logout ghcr.io 2>$null
          Write-Host "Skipping login (public image)"

      - name: Pull and load image
        shell: powershell
        run: |
          $sha = "${{ github.event.workflow_run.head_sha }}"
          if (-not $sha) { $sha = "${{ github.sha }}" }
          $shortSha = $sha.Substring(0, 7)
          $image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$shortSha"
          Write-Host "Pulling: $image"
          docker pull $image
          Write-Host "Loading into Minikube..."
          minikube image load $image

      - name: Render certs-secrets.yaml
        shell: powershell
        run: |
          $certFile = Join-Path $env:RUNNER_TEMP "certs-secrets.yaml"
          @"
          certs:
            caCert: "${{ secrets.OPC_CA_CERT }}"
            serverCert: "${{ secrets.OPC_SERVER_CERT }}"
            serverKey: "${{ secrets.OPC_SERVER_KEY }}"
            clientCert: "${{ secrets.OPC_CLIENT_CERT }}"
            clientKey: "${{ secrets.OPC_CLIENT_KEY }}"
          "@ | Out-File -FilePath $certFile -Encoding utf8
          Write-Host "Rendered certs-secrets.yaml to $certFile"

      - name: Deploy with Helm
        shell: powershell
        run: |
          # $certFile объявляем заново: переменные между шагами не сохраняются
          $certFile = Join-Path $env:RUNNER_TEMP "certs-secrets.yaml"

          $sha = "${{ github.event.workflow_run.head_sha }}"
          if (-not $sha) { $sha = "${{ github.sha }}" }
          $shortSha = $sha.Substring(0, 7)
          $imageTag = "sha-$shortSha"

          Write-Host "Deploying with Helm, image tag: $imageTag"

          # Секреты: если заданы в GitHub Secrets — используем, иначе дефолты из values.yaml
          $postgresPassword = "${{ secrets.POSTGRES_PASSWORD }}"
          if (-not $postgresPassword) { $postgresPassword = "change_me_secure_password" }

          $jwtSecretKey = "${{ secrets.JWT_SECRET_KEY }}"
          if (-not $jwtSecretKey) { $jwtSecretKey = "change_me_jwt_secret" }

          $adminPassword = "${{ secrets.ADMIN_PASSWORD }}"
          if (-not $adminPassword) { $adminPassword = "change_me_secure_admin_password" }

          $grafanaPassword = "${{ secrets.GRAFANA_PASSWORD }}"
          if (-not $grafanaPassword) { $grafanaPassword = "admin" }

          $opcPassword = "${{ secrets.OPC_PASSWORD }}"
          if (-not $opcPassword) { $opcPassword = "change_me_opc_password" }

          helm upgrade --install ${{ env.RELEASE_NAME }} ./helm/opc-monitor `
            --namespace ${{ env.NAMESPACE }} `
            --create-namespace `
            --values ./helm/opc-monitor/values-prod.yaml `
            --values $certFile `
            --set image.tag=$imageTag `
            --set secrets.postgresPassword=$postgresPassword `
            --set secrets.jwtSecretKey=$jwtSecretKey `
            --set secrets.adminPassword=$adminPassword `
            --set secrets.grafanaPassword=$grafanaPassword `
            --set secrets.opcPassword=$opcPassword `
            --timeout 2m

          Write-Host "Helm deploy complete"

          # Не оставляем сертификаты на self-hosted runner между запусками
          if (Test-Path $certFile) {
            Remove-Item $certFile -Force
            Write-Host "Removed temporary $certFile"
          }

      - name: Wait for rollout
        shell: powershell
        run: |
          Write-Host "Waiting for web rollout..."
          kubectl rollout status deployment/web -n ${{ env.NAMESPACE }} --timeout=3m

          Write-Host "Waiting for client rollout..."
          kubectl rollout status deployment/client -n ${{ env.NAMESPACE }} --timeout=3m

      - name: Verify
        shell: powershell
        run: |
          Write-Host "=== Helm releases ==="
          helm list -n ${{ env.NAMESPACE }}

          Write-Host "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }}

      - name: Summary
        shell: powershell
        run: |
          Write-Host "## Deploy Complete (Helm)" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Helm release:**" >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY
          helm list -n ${{ env.NAMESPACE }} >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Pods:**" >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY