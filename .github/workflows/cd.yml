name: CD - Deploy to Local Minikube

on:
  workflow_run:
    workflows: ["CI - Build & Push"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rosimus/opc-monitor
  NAMESPACE: opc-monitor
  RELEASE_NAME: opc-monitor

jobs:
  deploy:
    name: Deploy to Local Minikube
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check environment
        shell: powershell
        run: |
          Write-Host "=== Docker ==="
          docker --version
          Write-Host "=== kubectl ==="
          kubectl version --client
          Write-Host "=== Minikube ==="
          minikube status
          Write-Host "=== Helm ==="
          helm version

      - name: Start Minikube if needed
        shell: powershell
        run: |
          $status = minikube status --format='{{.Host}}' 2>$null
          if ($status -ne 'Running') {
            Write-Host "Starting Minikube..."
            minikube start
          } else {
            Write-Host "Minikube already running"
          }
          kubectl config use-context minikube

      - name: Logout from GHCR
        shell: powershell
        run: |
          docker logout ghcr.io 2>$null
          Write-Host "Skipping login (public image)"

      - name: Pull and load image
        shell: powershell
        run: |
          $sha = "${{ github.event.workflow_run.head_sha }}"
          if (-not $sha) { $sha = "${{ github.sha }}" }
          $shortSha = $sha.Substring(0, 7)
          $image = "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$shortSha"
          Write-Host "Pulling: $image"
          docker pull $image
          Write-Host "Loading into Minikube..."
          minikube image load $image

      - name: Deploy with Helm
        shell: powershell
        run: |
          $sha = "${{ github.event.workflow_run.head_sha }}"
          if (-not $sha) { $sha = "${{ github.sha }}" }
          $shortSha = $sha.Substring(0, 7)
          $imageTag = "sha-$shortSha"
          
          Write-Host "Deploying with Helm, image tag: $imageTag"
          
          helm upgrade --install ${{ env.RELEASE_NAME }} ./helm/opc-monitor `
            --namespace ${{ env.NAMESPACE }} `
            --create-namespace `
            --values ./helm/opc-monitor/values-prod.yaml `
            --set image.tag=$imageTag `
            --timeout 2m
          
          Write-Host "Helm deploy complete"

      - name: Wait for rollout
        shell: powershell
        run: |
          Write-Host "Waiting for web rollout..."
          kubectl rollout status deployment/web -n ${{ env.NAMESPACE }} --timeout=3m
          
          Write-Host "Waiting for client rollout..."
          kubectl rollout status deployment/client -n ${{ env.NAMESPACE }} --timeout=3m

      - name: Verify
        shell: powershell
        run: |
          Write-Host "=== Helm releases ==="
          helm list -n ${{ env.NAMESPACE }}
          
          Write-Host "=== Pods ==="
          kubectl get pods -n ${{ env.NAMESPACE }}

      - name: Summary
        shell: powershell
        run: |
          Write-Host "## Deploy Complete (Helm)" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Helm release:**" >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY
          helm list -n ${{ env.NAMESPACE }} >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "**Pods:**" >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $env:GITHUB_STEP_SUMMARY
          Write-Host '```' >> $env:GITHUB_STEP_SUMMARY