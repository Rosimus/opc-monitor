global:
  scrape_interval: 15s
  evaluation_interval: 15s

# ============================================
# Правила алертов
# ============================================
rule_files:
  - /etc/prometheus/alerts.yml

# ============================================
# Alertmanager
# ============================================
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# ============================================
# Источники метрик
# ============================================
scrape_configs:
  - job_name: 'opc-monitor'
    static_configs:
      - targets: ['web:5000']
    metrics_path: /metrics

  - job_name: 'opc-client'
    static_configs:
      - targets: ['client:8001']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']