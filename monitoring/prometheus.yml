global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'opc-monitor'
    static_configs:
      - targets: ['web:5000']
    metrics_path: /metrics

  - job_name: 'opc-client'
    static_configs:
      - targets: ['client:8001']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres:9187']